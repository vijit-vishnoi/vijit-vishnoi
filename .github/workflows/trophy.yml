name: Generate Trophy
on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically once daily at midnight
  workflow_dispatch: # Allows you to manually trigger it

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=vijit-vishnoi&theme=radical&no-frame=true&no-bg=true&margin-w=15&rank=-%3F'
          path: .github/assets/trophy.svg
          token: ${{ secrets.PROFILE_PAT }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          git commit -m "Update trophy card" || exit 0
          git push
